<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>try{var __skin=localStorage.getItem('pan-skin');if(__skin!=='starship'&&__skin!=='original'){__skin='original';}document.documentElement.dataset.skin=__skin;var __link=document.createElement('link');__link.rel='icon';__link.type='image/png';__link.href=__skin==='starship'?'/assets/planet-favicon.png?v=2':'/favicon.ico';document.head.appendChild(__link);}catch(e){}</script>
    <script src="/assets/skin.js"></script>
    <title>FlareDrive-R2 - 优雅的 Cloudflare R2 网盘文件库</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.2.37/dist/vue.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@0.27.2/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader@0.9.5/dist/vue3-sfc-loader.min.js"></script>
    <link rel="stylesheet" href="https://static.zeoseven.com/zsft/243/main/result.css" />
    <link rel="prefetch" href="/assets/main.mjs" />
    <link rel="prefetch" href="/assets/MimeIcon.vue" />
    <link rel="stylesheet" href="/assets/main.css" />
    <link rel="stylesheet" href="/assets/skin-starship.css" />
    <link rel="manifest" href="/assets/manifest.json" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      const { loadModule } = window['vue3-sfc-loader'];

      const options = {
        moduleCache: { vue: Vue },
        async getFile(url) {
          const res = await fetch(url);
          if (!res.ok)
            throw Object.assign(new Error(res.statusText + ' ' + url), { res });
          return {
            getContentData: (asBinary) =>
              asBinary ? res.arrayBuffer() : res.text(),
          };
        },
        addStyle(textContent) {
          const style = document.createElement('style');
          style.textContent = textContent;
          const ref = document.head.getElementsByTagName('style')[0] || null;
          document.head.insertBefore(style, ref);
        },
      };

      const app = Vue.createApp({
        components: {
          App: Vue.defineAsyncComponent(() =>
            loadModule('/assets/App.vue', options)
          ),
        },
        template: '<App></App>',
      });

      app.mount('#app');
    </script>

    <script type="module"></script>
  </body>
</html>
